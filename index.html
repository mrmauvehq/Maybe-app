<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mauve</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root { --plum:#6d2e46; --ink:#221a1e; --soft:#f7f2f4; --line:#e4d8dd; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, "Segoe UI", Roboto, sans-serif; background:var(--soft); color:var(--ink); }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 48px; padding-top:calc(20px + env(safe-area-inset-top)); }
  h1 { font-size:26px; margin:8px 0 2px; color:var(--plum); letter-spacing:.5px; }
  .sub { color:#7a6a70; font-size:14px; margin-bottom:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 4px; color:var(--plum); text-transform:uppercase; letter-spacing:1px; }
  .big { font-size:22px; font-weight:600; margin:4px 0; }
  .flag { border-top:1px solid var(--line); padding:10px 0; font-size:14px; }
  .flag:first-of-type { border-top:none; }
  .amt { float:right; font-weight:600; }
  .muted { color:#7a6a70; font-size:13px; }
  input { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:16px; margin-bottom:10px; }
  button { width:100%; padding:12px; border:none; border-radius:10px; background:var(--plum); color:#fff; font-size:16px; cursor:pointer; }
  button.ghost { background:none; color:var(--plum); border:1px solid var(--line); width:auto; padding:8px 14px; font-size:14px; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  #err { color:#b00020; font-size:14px; min-height:18px; margin-bottom:8px; }
  .pill { display:inline-block; background:#f3e3ea; color:var(--plum); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; }
  .chatlog { max-height:340px; overflow-y:auto; margin-bottom:10px; }
  .msg { padding:9px 12px; border-radius:12px; margin-bottom:8px; font-size:15px; line-height:1.45; white-space:pre-wrap; }
  .msg.me { background:#f3e3ea; margin-left:36px; }
  .msg.bot { background:var(--soft); margin-right:36px; }
  .chatrow { display:flex; gap:8px; }
  .chatrow textarea { flex:1; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:16px; font-family:inherit; resize:none; margin:0; }
  .chatrow button { width:auto; padding:12px 18px; }
  .msg a { color:var(--plum); font-weight:600; }
  .msg a { word-break:break-all; }
  .vidbtn { display:block; text-align:center; background:var(--plum); color:#fff !important;
    padding:14px; border-radius:10px; margin-top:10px; font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loginView">
    <h1>MAUVE</h1>
    <div class="sub">Your house. Sign in to open the vault.</div>
    <div class="card">
      <div id="err"></div>
      <input id="email" type="email" value="mrmauvehq@gmail.com" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="signIn">Sign in</button>
    </div>
  </div>

  <div id="deskView" style="display:none">
    <div class="row">
      <div>
        <h1>MAUVE</h1>
        <div class="sub" id="whoLine">The Concierge</div>
      </div>
      <button class="ghost" id="signOut">Sign out</button>
    </div>

    <div class="card">
      <h2>The Concierge</h2>
      <div class="chatlog" id="chatLog"></div>
      <div class="chatrow">
        <textarea id="chatInput" rows="2" placeholder="Ask the Concierge..."></textarea>
        <button id="chatSend">Send</button>
      </div>
    </div>

    <div class="muted" style="text-align:center">Mauve - the Concierge is the door.</div>
  </div>
</div>

<script>
  const sb = window.supabase.createClient(
    "https://fkehodlaxbdtpeifkzcg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrZWhvZGxheGJkdHBlaWZremNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3MjkzNjQsImV4cCI6MjExMTMwNTM2NH0.YOaeb58PqQPUgLfEeg4dghO_kz_JR_bON3O38dL3p2A"
  );
  const $ = id => document.getElementById(id);
  const money = n => "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});

  async function showDesk() {
    $("loginView").style.display = "none";
    $("deskView").style.display = "block";
    $("loginView").style.display = "none";
    if (!greeted) {
      greeted = true;
      addMsg("bot", "Welcome to Mauve. I'm the Concierge - the house's memory, its eyes on the market, and a partner at your desk, from invoices to campaigns. Ask, and I'll pull it.");
    }
  }

  $("signIn").onclick = async () => {
    $("err").textContent = "";
    const { error } = await sb.auth.signInWithPassword({
      email: $("email").value.trim(), password: $("password").value });
    if (error) { $("err").textContent = error.message; return; }
    showDesk();
  };
  $("signOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };

  const chatHistory = [];
  let greeted = false;
  function addMsg(cls, text) {
    const d = document.createElement("div");
    d.className = "msg " + cls; d.textContent = text;
    $("chatLog").appendChild(d);
    $("chatLog").scrollTop = $("chatLog").scrollHeight;
    return d;
  }
  function renderBot(el, text) {
    const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    let html = esc.replace(/https:\/\/[^\s<]+/g, (u) =>
      '<a href="' + u + '" target="_blank" rel="noopener">' + u + "</a>");
    const m = text.match(/https:\/\/drive\.google\.com\/file\/d\/[A-Za-z0-9_-]+[^\s<]*/);
    if (m) {
      html += '<a class="vidbtn" href="' + m[0] + '" target="_blank" rel="noopener">\u25B6 Watch the video</a>';
    }
    el.innerHTML = html;
    $("chatLog").scrollTop = $("chatLog").scrollHeight;
  }
  async function sendChat() {
    const inp = $("chatInput");
    const text = inp.value.trim();
    if (!text) return;
    inp.value = "";
    addMsg("me", text);
    const wait = addMsg("bot", "Thinking...");
    const { data, error } = await sb.functions.invoke("concierge", { body: { message: text, history: chatHistory } });
    let reply;
    if (error) {
      reply = "That took too long - the engine is busy tonight. Give it a moment and ask me again.";
      try { const b = await error.context.json(); if (b && b.error) reply = b.error; } catch (e) {}
    } else if (data && data.error) { reply = data.error; }
    else { reply = (data && data.reply) || "Empty answer."; }
    renderBot(wait, reply);
    chatHistory.push({ role: "user", text }, { role: "model", text: reply });
  }
  $("chatSend").onclick = sendChat;
  sb.auth.getSession().then(({ data }) => { if (data.session) showDesk(); });
</script>
</body>
</html>
