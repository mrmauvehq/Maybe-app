<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mauve</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  :root { --plum:#6d2e46; --ink:#221a1e; --soft:#f7f2f4; --line:#e4d8dd; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, "Segoe UI", Roboto, sans-serif; background:var(--soft); color:var(--ink); }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 48px; padding-top:calc(20px + env(safe-area-inset-top)); }
  h1 { font-size:26px; margin:8px 0 2px; color:var(--plum); letter-spacing:.5px; }
  .sub { color:#7a6a70; font-size:14px; margin-bottom:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 4px; color:var(--plum); text-transform:uppercase; letter-spacing:1px; }
  .big { font-size:22px; font-weight:600; margin:4px 0; }
  .flag { border-top:1px solid var(--line); padding:10px 0; font-size:14px; }
  .flag:first-of-type { border-top:none; }
  .amt { float:right; font-weight:600; }
  .muted { color:#7a6a70; font-size:13px; }
  input { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:16px; margin-bottom:10px; }
  button { width:100%; padding:12px; border:none; border-radius:10px; background:var(--plum); color:#fff; font-size:16px; cursor:pointer; }
  button.ghost { background:none; color:var(--plum); border:1px solid var(--line); width:auto; padding:8px 14px; font-size:14px; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  #err { color:#b00020; font-size:14px; min-height:18px; margin-bottom:8px; }
  .pill { display:inline-block; background:#f3e3ea; color:var(--plum); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; }
  .chatlog { max-height:340px; overflow-y:auto; margin-bottom:10px; }
  .msg { padding:9px 12px; border-radius:12px; margin-bottom:8px; font-size:15px; line-height:1.45; white-space:pre-wrap; }
  .msg.me { background:#f3e3ea; margin-left:36px; }
  .msg.bot { background:var(--soft); margin-right:36px; }
  .chatrow { display:flex; gap:2px; align-items:flex-end; background:#fff; border:1px solid var(--line);
    border-radius:28px; padding:5px; }
  .chatrow textarea { flex:1; min-width:0; padding:10px 4px; border:none; background:transparent;
    font-size:16px; font-family:inherit; resize:none; margin:0; outline:none; }
  .chatrow button { width:auto; padding:12px 18px; }
  .msg a { color:var(--plum); font-weight:600; }
  .msg a { word-break:break-all; }
  .pdfbtn { margin-top:9px; padding:5px 13px; font-size:12.5px; font-weight:600; border-radius:999px;
    background:#fff; color:var(--plum); border:1px solid var(--line); width:auto; }
  .pdfbtn:disabled { opacity:.55; }
  .vidbtn { display:block; text-align:center; background:var(--plum); color:#fff !important;
    padding:14px; border-radius:10px; margin-top:10px; font-weight:600; text-decoration:none; }
  .attachbtn { width:40px; height:40px; flex:none; padding:0; border-radius:50%; background:transparent;
    color:var(--plum); border:none; font-size:24px; line-height:1; align-self:flex-end; }
  .sendbtn { width:40px; height:40px; flex:none; padding:0; border-radius:50%; font-size:19px; align-self:flex-end; }
  .micbtn { width:40px; height:40px; flex:none; padding:0; border-radius:50%; background:transparent;
    color:var(--plum); border:none; align-self:flex-end; display:flex; align-items:center; justify-content:center; }
  .micbtn.rec { background:var(--plum); color:#fff; }
  .micbtn svg { width:19px; height:19px; }
  .chip { display:none; align-items:center; gap:8px; background:#f3e3ea; color:var(--plum);
    border-radius:999px; padding:5px 12px; font-size:13px; font-weight:600; margin-bottom:8px; width:fit-content; }
  .chip button { width:auto; padding:0 4px; background:none; color:var(--plum); font-size:15px; }
  .msg img.att { display:block; max-width:100%; border-radius:8px; margin-top:8px; }
  .msg .attname { font-size:13px; opacity:.75; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loginView">
    <h1>MAUVE</h1>
    <div class="sub">Your house. Sign in to open the vault.</div>
    <div class="card">
      <div id="err"></div>
      <input id="email" type="email" value="mrmauvehq@gmail.com" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="signIn">Sign in</button>
    </div>
  </div>

  <div id="deskView" style="display:none">
    <div class="row">
      <div>
        <h1>MAUVE</h1>
        <div class="sub" id="whoLine">The Concierge</div>
      </div>
      <button class="ghost" id="signOut">Sign out</button>
    </div>

    <div class="card">
      <h2>The Concierge</h2>
      <div class="chatlog" id="chatLog"></div>
      <div class="chip" id="attChip"><span id="attName"></span><button id="attClear" title="Remove attachment">x</button></div>
      <div class="chatrow">
        <button class="attachbtn" id="attachBtn" title="Attach a photo or video" aria-label="Attach a photo or video">+</button>
        <textarea id="chatInput" rows="2" placeholder="Ask the Concierge..."></textarea>
        <button class="micbtn" id="micBtn" title="Dictate" aria-label="Dictate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <button class="sendbtn" id="chatSend" title="Send" aria-label="Send">↑</button>
      </div>
      <input type="file" id="filePick" accept="image/*,video/*" style="display:none">
    </div>

    <div class="muted" style="text-align:center">Mauve - the Concierge is the door.</div>
  </div>
</div>

<script>
  const sb = window.supabase.createClient(
    "https://fkehodlaxbdtpeifkzcg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrZWhvZGxheGJkdHBlaWZremNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3MjkzNjQsImV4cCI6MjExMTMwNTM2NH0.YOaeb58PqQPUgLfEeg4dghO_kz_JR_bON3O38dL3p2A"
  );
  const $ = id => document.getElementById(id);
  const money = n => "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});

  async function showDesk() {
    $("loginView").style.display = "none";
    $("deskView").style.display = "block";
    $("loginView").style.display = "none";
    if (!greeted) {
      greeted = true;
      addMsg("bot", "Welcome to Mauve. I'm the Concierge - the house's memory, its eyes on the market, and a partner at your desk, from invoices to campaigns. Ask, and I'll pull it.");
    }
  }

  $("signIn").onclick = async () => {
    $("err").textContent = "";
    const { error } = await sb.auth.signInWithPassword({
      email: $("email").value.trim(), password: $("password").value });
    if (error) { $("err").textContent = error.message; return; }
    showDesk();
  };
  $("signOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };

  const chatHistory = [];
  let greeted = false;
  function addMsg(cls, text) {
    const d = document.createElement("div");
    d.className = "msg " + cls; d.textContent = text;
    $("chatLog").appendChild(d);
    $("chatLog").scrollTop = $("chatLog").scrollHeight;
    return d;
  }
  function renderBot(el, text) {
    const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    let html = esc.replace(/https:\/\/[^\s<]+/g, (u) =>
      '<a href="' + u + '" target="_blank" rel="noopener">' + u + "</a>");
    const m = text.match(/https:\/\/drive\.google\.com\/file\/d\/[A-Za-z0-9_-]+[^\s<]*/);
    if (m) {
      html += '<a class="vidbtn" href="' + m[0] + '" target="_blank" rel="noopener">\u25B6 Watch the video</a>';
    }
    el.innerHTML = html;
    if (text.length > 280) {
      const b = document.createElement("button");
      b.className = "pdfbtn"; b.textContent = "Save as PDF";
      b.title = "Save this answer as a PDF";
      b.onclick = () => exportPdf(text, b);
      el.appendChild(document.createElement("br"));
      el.appendChild(b);
    }
    $("chatLog").scrollTop = $("chatLog").scrollHeight;
  }
  let pendingAtt = null; // { mime, data (base64), name, kind, previewUrl }
  function clearAtt() {
    pendingAtt = null;
    $("attChip").style.display = "none";
    $("filePick").value = "";
  }
  $("attClear").onclick = clearAtt;
  $("attachBtn").onclick = () => $("filePick").click();
  $("filePick").onchange = async () => {
    const f = $("filePick").files[0];
    if (!f) return;
    const isImg = f.type.startsWith("image/");
    const isVid = f.type.startsWith("video/");
    if (!isImg && !isVid) { addMsg("bot", "That file type will not work - send a photo or a video."); return; }
    if (isVid && f.size > 12 * 1024 * 1024) {
      addMsg("bot", "That video is too large for the live door (12 MB cap) - trim it or send a shorter clip.");
      $("filePick").value = ""; return;
    }
    let blob = f, mime = f.type;
    if (isImg && f.size > 1500000) {
      const bmp = await createImageBitmap(f);
      const scale = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
      mime = "image/jpeg";
    }
    const buf = await blob.arrayBuffer();
    let bin = ""; const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
    pendingAtt = { mime, data: btoa(bin), name: f.name, kind: isImg ? "image" : "video",
      previewUrl: isImg ? URL.createObjectURL(blob) : null };
    $("attName").textContent = (isImg ? "Photo: " : "Video: ") + f.name;
    $("attChip").style.display = "flex";
  };

// Shared Mauve report renderer. Uses a PDFLib-compatible object (browser global or node require).
async function buildReportPdf(PDFLib, rawText, subtitle) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  const F = await doc.embedFont(StandardFonts.Helvetica);
  const FB = await doc.embedFont(StandardFonts.HelveticaBold);
  const PLUM = rgb(0.431, 0.165, 0.235), DARK = rgb(0.13, 0.11, 0.12),
        GREY = rgb(0.42, 0.40, 0.41), LINEC = rgb(0.80, 0.72, 0.74),
        LIGHT = rgb(0.957, 0.925, 0.933);
  const W = 612, H = 792, M = 54, CW = W - 2 * M;
  let page = null, y = 0;

  function clean(s) {
    return s.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')
            .replace(/[\u2013\u2014]/g, "-").replace(/[^\x00-\xFF]/g, "");
  }
  function newPage(first) {
    page = doc.addPage([W, H]); y = H - M;
    if (first) {
      page.drawText("MAUVE", { x: M, y: y - 6, size: 17, font: FB, color: PLUM });
      y -= 17;
      page.drawText(clean(subtitle), { x: M, y, size: 9, font: F, color: GREY });
      y -= 9;
      page.drawLine({ start: { x: M, y }, end: { x: W - M, y }, thickness: 1.4, color: PLUM });
      y -= 22;
    }
  }
  function need(h) { if (y - h < M + 6) newPage(false); }
  // Tokenize into words with bold flags, honoring **bold** spans.
  function words(text, baseBold) {
    const out = [];
    const parts = text.split("**");
    parts.forEach((part, i) => {
      const bold = baseBold || (i % 2 === 1);
      part.split(/\s+/).filter(Boolean).forEach(w => out.push({ w, bold }));
    });
    return out;
  }
  function wrapRuns(text, size, maxW, baseBold) {
    const toks = words(text, baseBold);
    const lines = []; let line = [], lw = 0;
    const spaceW = F.widthOfTextAtSize(" ", size);
    for (const t of toks) {
      const fnt = t.bold ? FB : F;
      const ww = fnt.widthOfTextAtSize(t.w, size);
      if (line.length && lw + spaceW + ww > maxW) { lines.push(line); line = []; lw = 0; }
      if (line.length) lw += spaceW;
      line.push(t); lw += ww;
    }
    if (line.length) lines.push(line);
    return lines;
  }
  function drawPara(text, size, opt) {
    opt = opt || {};
    const indent = opt.indent || 0, lh = size * 1.45, maxW = CW - indent;
    const lines = wrapRuns(text, size, maxW, !!opt.bold);
    need(lines.length * lh + 2);
    for (const line of lines) {
      let x = M + indent;
      const spaceW = F.widthOfTextAtSize(" ", size);
      line.forEach((t, i) => {
        if (i) x += spaceW;
        const fnt = t.bold ? FB : F;
        page.drawText(t.w, { x, y, size, font: fnt, color: opt.color || DARK });
        x += fnt.widthOfTextAtSize(t.w, size);
      });
      y -= lh;
    }
    y -= (opt.after != null ? opt.after : 4);
  }
  function drawTable(rows) {
    const cols = Math.max.apply(null, rows.map(r => r.length));
    const size = 8.6, lh = 11;
    const lens = Array(cols).fill(8);
    rows.forEach(r => r.forEach((c, i) => { lens[i] = Math.max(lens[i], c.replace(/\*\*/g, "").length); }));
    const tot = lens.reduce((a, b) => a + b, 0);
    const widths = lens.map(l => Math.max(52, CW * l / tot));
    rows.forEach((r, ri) => {
      const cells = [];
      let rowLines = 1;
      for (let i = 0; i < cols; i++) {
        const c = (r[i] || "").replace(/\*\*/g, "");
        const wrapped = wrapRuns(c, size, widths[i] - 8, false).map(l => l.map(t => t.w).join(" "));
        cells.push(wrapped.length ? wrapped : [""]);
        rowLines = Math.max(rowLines, cells[i].length);
      }
      const rh = rowLines * lh + 6;
      need(rh + 2);
      if (ri === 0) { page.drawRectangle({ x: M, y: y - rowLines * lh - 3, width: CW, height: rowLines * lh + 6, color: LIGHT }); }
      let x = M;
      for (let i = 0; i < cols; i++) {
        cells[i].forEach((ln, li) => {
          page.drawText(ln, { x: x + 4, y: y - li * lh, size, font: ri === 0 ? FB : F, color: DARK });
        });
        x += widths[i];
      }
      y -= rowLines * lh + 3;
      page.drawLine({ start: { x: M, y }, end: { x: W - M, y }, thickness: ri === 0 ? 0.9 : 0.4, color: ri === 0 ? PLUM : LINEC });
      y -= 3;
    });
    y -= 6;
  }

  newPage(true);
  const lines = clean(rawText).split("\n");
  let i = 0, para = [];
  function flushPara() { if (para.length) { drawPara(para.join(" "), 10.5, {}); para = []; } }
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*\|/.test(ln)) {
      flushPara();
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        const cells = lines[i].trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
        if (!cells.every(c => /^:?-+:?$/.test(c))) rows.push(cells);
        i++;
      }
      if (rows.length) drawTable(rows);
      continue;
    }
    const t = ln.trim();
    if (!t) { flushPara(); i++; continue; }
    if (/^#{1,3}\s/.test(t)) { flushPara(); drawPara(t.replace(/^#{1,3}\s/, ""), 12.5, { bold: true, color: PLUM, after: 5 }); i++; continue; }
    if (/^\*\*[^*]+\*\*$/.test(t)) { flushPara(); drawPara(t.replace(/\*\*/g, ""), 11, { bold: true, after: 4 }); i++; continue; }
    if (/^[-*]\s+/.test(t) || t.startsWith("\u2022 ")) {
      flushPara();
      page.drawText("-", { x: M + 2, y, size: 10.5, font: FB, color: PLUM });
      drawPara(t.replace(/^[-*\u2022]\s+/, ""), 10.5, { indent: 14, after: 3 });
      i++; continue;
    }
    para.push(t); i++;
  }
  flushPara();

  const pages = doc.getPages();
  pages.forEach((p, idx) => {
    p.drawText("Mauve - the Concierge is the door.", { x: M, y: 30, size: 8, font: F, color: GREY });
    const label = "Page " + (idx + 1) + " of " + pages.length;
    p.drawText(label, { x: W - M - F.widthOfTextAtSize(label, 8), y: 30, size: 8, font: F, color: GREY });
  });
  return await doc.save();
}

  async function exportPdf(text, btn) {
    if (!window.PDFLib) { addMsg("bot", "The PDF maker could not load just now - try again in a moment."); return; }
    const oldLabel = btn.textContent;
    btn.disabled = true; btn.textContent = "Preparing...";
    try {
      const now = new Date();
      const dateStr = now.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
      const bytes = await buildReportPdf(window.PDFLib, text, "Concierge report - " + dateStr);
      const blob = new Blob([bytes], { type: "application/pdf" });
      const fname = "mauve-report-" + now.toISOString().slice(0, 10) + ".pdf";
      let url = URL.createObjectURL(blob);
      try {
        const { data: mem } = await sb.from("brand_members").select("brand_id").limit(1);
        if (mem && mem.length) {
          const path = mem[0].brand_id + "/exports/" + Date.now() + "-" + fname;
          const up = await sb.storage.from("vault-files").upload(path, blob, { contentType: "application/pdf" });
          if (!up.error) {
            const signed = await sb.storage.from("vault-files").createSignedUrl(path, 60 * 60 * 24 * 7);
            if (signed.data && signed.data.signedUrl) url = signed.data.signedUrl;
          }
        }
      } catch (e) { /* vault copy is best-effort; the download still works */ }
      const d = addMsg("bot", "");
      d.innerHTML = 'Your PDF is ready: <a href="' + url + '" target="_blank" rel="noopener">Open / save the report (PDF)</a>';
      $("chatLog").scrollTop = $("chatLog").scrollHeight;
    } catch (e) {
      addMsg("bot", "The PDF did not render this time - try again in a moment.");
    }
    btn.disabled = false; btn.textContent = oldLabel;
  }

  async function sendChat() {
    const inp = $("chatInput");
    const text = inp.value.trim();
    if (!text && !pendingAtt) return;
    inp.value = "";
    const att = pendingAtt; clearAtt();
    const shown = text || (att && att.kind === "video" ? "(sent a video)" : "(sent a photo)");
    const bubble = addMsg("me", shown);
    if (att && att.kind === "image" && att.previewUrl) {
      const im = document.createElement("img");
      im.className = "att"; im.src = att.previewUrl; bubble.appendChild(im);
    } else if (att) {
      const nm = document.createElement("div");
      nm.className = "attname"; nm.textContent = att.name; bubble.appendChild(nm);
    }
    const wait = addMsg("bot", att ? "Looking..." : "Thinking...");
    const body = { message: text || "I attached a file - take a look and tell me what you see that matters.", history: chatHistory };
    if (att) body.attachment = { mime_type: att.mime, data: att.data, name: att.name };
    const { data, error } = await sb.functions.invoke("concierge", { body });
    let reply;
    if (error) {
      reply = "That took too long - the engine is busy tonight. Give it a moment and ask me again.";
      try { const b = await error.context.json(); if (b && b.error) reply = b.error; } catch (e) {}
    } else if (data && data.error) { reply = data.error; }
    else { reply = (data && data.reply) || "Empty answer."; }
    renderBot(wait, reply);
    chatHistory.push({ role: "user", text: shown }, { role: "model", text: reply });
  }
  $("chatSend").onclick = sendChat;

  let recog = null, listening = false;
  $("micBtn").onclick = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      addMsg("bot", "Dictation is not available in this browser window - the keyboard's own mic key works too.");
      return;
    }
    if (listening) { recog.stop(); return; }
    recog = new SR();
    recog.lang = "en-US";
    recog.interimResults = true;
    let base = $("chatInput").value ? $("chatInput").value.replace(/\s*$/, "") + " " : "";
    recog.onresult = (e) => {
      let txt = "";
      for (const r of e.results) txt += r[0].transcript;
      $("chatInput").value = base + txt;
    };
    recog.onend = () => { listening = false; $("micBtn").classList.remove("rec"); };
    recog.onerror = recog.onend;
    listening = true;
    $("micBtn").classList.add("rec");
    recog.start();
  };
  sb.auth.getSession().then(({ data }) => { if (data.session) showDesk(); });
</script>
</body>
</html>
